name: training_log
description: "Gym Workout Diary — приложение для учёта тренировок в зале."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  go_router: ^15.1.2
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.31
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.26.1
  mocktail: ^1.0.4

# path_provider_foundation 2.6.0 crashes on iOS release due to objective_c FFI loading.
# See: https://github.com/flutter/flutter/issues/186794
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  generate: true
